[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"

# Optimizer settings
optimizer = true
# To lower the contract size under EIP-170. Reduce the optimizer runs to 1.
# Final margins this wave:
# PassiveBucket +12 B, ActiveBucket +3,461 B, PureMembership +4,619 B. `forge fmt --check` clean
# and `forge test` 604/604 pass after (594 pre-existing + 10 new feature tests), hard rule 13.
# optimizer_runs UNCHANGED at 1 this wave.
optimizer_runs = 1

# EVM version
evm_version = "cancun"

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@chainlink/=lib/chainlink-brownie-contracts/contracts/src/v0.8/"
]

# File system permissions
fs_permissions = [
    { access = "read", path = "./configs" },
    { access = "read-write", path = "./broadcast" },
    # read-only access to compiled ABI artifacts, so
    # test/conformance/BucketInfoSurface.t.sol can reflect on BucketInfo's
    # actual external/public function set via `vm.readFile` + `vm.parseJson`
    # instead of a hand-maintained list that silently drifts from source.
    # Read-only, and scoped to `./out` only -- no write/broadcast capability
    # granted, and no `ffi` needed (`ffi` is not enabled anywhere in this
    # file and this change does not turn it on).
    { access = "read", path = "./out" }
]

# Gas reporting
gas_reports = ["*"]

# Testing configuration
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 15
# This is free today; once handlers exist, flipping it turns a
# passing run red. 
fail_on_revert = true

# Etherscan verification
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
polygon = { key = "${ETHERSCAN_API_KEY}" }
polygon_amoy = { key = "${ETHERSCAN_API_KEY}" }

# RPC endpoints
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"
localhost = "http://localhost:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
