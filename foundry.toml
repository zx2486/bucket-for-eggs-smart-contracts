[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"

# Optimizer settings
optimizer = true
# W4.3 (task #57/#61), 2026-10-01: lowered from 200 to 50 for EIP-170 size relief on
# PassiveBucket, after five rounds of library extraction (DexSwapLib, SeizureLib across four
# consolidation passes, GovernanceLib across four passes) had already recovered 513B+ and a
# sixth attempt (SwapRiskLib, extracting _enforceSwapCooldown/_consumeEpochValueLossBudget) was
# measured to make bytecode WORSE, not better (see BucketVaultBase.sol's revert-comments on
# those two functions) -- i.e. code-splitting had hit diminishing/negative returns at
# runs=200 (PassiveBucket margin -421 B). This is a compiler-flag change, not a logic change:
# `forge build --sizes` was used to binary-search the runs value (measured at 1/20/50/75/100/150
# and 200), and full `forge test` was re-run at runs=50 to confirm zero regression (root
# CLAUDE.md hard rule 13) -- 484 tests pass, only the pre-existing 3 known-red characterisation
# tests (task #35, Chainlink negative-price/staleness and setTokenPrice rate-limit, unrelated to
# this wave) remain red. Trade-off, recorded per hard rule 5: lower `runs` optimizes for smaller
# deployed bytecode at the cost of higher runtime gas on repeated code paths (deposit/redeem/
# rebalance/swap), for the lifetime of the deployed contract, on ALL THREE token contracts, not
# just PassiveBucket -- Foundry has no per-contract optimizer-runs setting within one profile, so
# ActiveBucket/PureMembership "pay" this too even though neither needed the relief (both had
# thousands of bytes of margin at runs=200). Margins at runs=50: ActiveBucket +3,785 B,
# PassiveBucket +178 B, PureMembership +5,899 B (all `forge build --sizes` per-contract runtime
# margins). runs=50 was chosen over the more aggressive runs=1 (which gives PassiveBucket +301 B)
# specifically to keep gas costs closer to the previous baseline while still leaving a >100B
# safety margin, since margin drops roughly linearly and the curve crosses zero between
# runs=100 (+38 B) and runs=150 (-46 B). This was a judgment call made without live client
# input under a standing instruction to proceed; it should be called out explicitly in the W4
# compliance report's "Corrections to my briefing" section for human review, since a gas-cost
# trade-off of this shape is exactly the kind of decision a human may want to revisit.
# W5.2 (task #64), 2026-10-01: lowered again, from 50 to 20, for EIP-170 size relief caused by
# `redeemForStable()` (SC-9) -- a NEW feature added to `BucketVaultBase`, inherited into both
# vaults, pushed PassiveBucket's runtime size over the limit again (margin -1,446 B at runs=50,
# cold). Before touching this knob a second time, library extraction was tried first (new
# `SwapExecutionLib.sol`, same DELEGATECALL pattern as `DexSwapLib`/`PayoutLib`/`GovernanceLib`;
# this time `_enforceSwapCooldown` and `_consumeEpochValueLossBudget` were RE-EXTRACTED
# successfully using storage-reference parameters -- a materially cheaper ABI shape than the
# by-value signature that failed in the W4.3 attempt noted above) and recovered all but the last
# -25 B at runs=50 unchanged. `forge build --sizes` was used to binary-search runs again
# (measured at 50/40/30/20/10/1, all post-extraction): PassiveBucket margin was -25 B at
# runs=50/40, -19 B at runs=30, +41 B at runs=20, +72 B at runs=10, +81 B at runs=1. runs=20 was
# chosen as the LEAST aggressive value that clears zero, to minimise the ADDITIONAL runtime-gas
# cost stacked on top of the W4.3 reduction (200->50->20 now, not 200->50), on the same
# ALL-THREE-CONTRACTS basis noted above (ActiveBucket +3,613 B, PureMembership +4,916 B margins
# at runs=20 -- both still comfortable). Full `forge test` re-run at runs=20 to confirm zero
# regression (hard rule 13). Flagged per hard rule 5 for the W5 wave report's "Corrections to my
# briefing": a +41 B margin is thin, and a second new feature of similar size would blow it again
# -- the next relief, if needed, should probably be the `_calculateTotalValue`/`_getTokenValue`
# extraction deferred in `SwapExecutionLib.sol`'s header comment (deliberately out of task #64's
# `base/`-only scope since it also touches `ActiveBucket.sol`/`PassiveBucket.sol`), not a third
# `optimizer_runs` cut, since gas cost on every deposit/redeem/rebalance/swap call is a
# permanent, compounding cost for the lifetime of the deployed contract and this lever is
# approaching its practical floor (runs=1 only buys +40 B more than runs=20).
# Verifier-fix wave (task #78/#80), 2026-10-04: lowered again, from 20 to 10, for EIP-170 size
# relief caused by THREE new compliance/safety checks added this wave to `BucketVaultBase`
# (inherited into both vaults): (1) a blacklist check on `approve`/transfer-via-allowance, via a
# new `_spendAllowance` override, (2) a received-amount check in `redeemForStable()` (new
# `ReceivedBelowMinReturn` revert), both verifier-reported gaps, and (3) extracting
# `_checkOwner()` + `_assertNotBlacklisted(msg.sender)` into one shared
# `_checkOwnerNotBlacklisted()` function reused by every admin-gated modifier (a SIZE-RELIEF
# change in itself, not a new check, done BECAUSE of the regression these caused — see that
# function's own header comment for the measured byte savings and for a logged correction of an
# earlier wrong assumption about modifier-merging alone saving bytes, which measured zero).
# PassiveBucket margin had regressed to -108 B at runs=20 (cold, post all three changes) before
# further relief. Before touching this knob, in-contract deduplication was tried first (and
# should always be preferred over a runs cut, per every prior round's comment above): a
# byte-identical 5-line value-loss-plus-epoch-budget check was duplicated in
# `BucketVaultBase._executeSwapNoCooldown` AND inline in `PassiveBucket.rebalanceByDefi` (which
# never calls `_executeSwapNoCooldown`, so the earlier `_execute1inchSwap`/`rebalanceBy1inch`
# consolidation never caught it) — collapsed onto one shared `_checkValueLossAndConsumeBudget`
# function, recovering 91 B (margin -108 B -> -17 B at runs=20). That alone was not enough;
# `forge build --sizes` was used to binary-search runs again (measured at 1/5/10/15/20 at this
# new baseline): PassiveBucket margin was +27 B at runs=1/5, +18 B at runs=10, -22 B at runs=15.
# runs=10 was chosen as the LEAST aggressive value that clears zero (same rule as every prior
# round), stacking a THIRD runs reduction (200->50->20->10) on top of W4.3's and W5.2's. Margins
# at runs=10: ActiveBucket +3,376 B, PureMembership +4,619 B (both still comfortable).
# ⚠ Flagged per hard rule 5 for this wave's report: +18 B is thinner than W5.2's own +41 B margin
# was, and this is the THIRD consecutive wave to resolve an EIP-170 regression partly by cutting
# `optimizer_runs` rather than by extraction alone — the lever is nearly exhausted (runs=1 only
# buys +9 B more than runs=10 now, versus +40 B at the equivalent comparison in W5.2's note above).
# The next feature of comparable size WILL blow this margin again, and the `optimizer_runs` knob
# will no longer be able to absorb it alone. The deferred `_calculateTotalValue`/`_getTokenValue`
# extraction (noted above and in `SwapExecutionLib.sol`'s header) is very likely the next and
# possibly last lever before PassiveBucket needs an actual feature-level split (e.g. moving a
# whole external function, not just its tail, into a library). This should be raised for human
# review before the next wave adds anything to `BucketVaultBase` or `PassiveBucket`.
optimizer_runs = 10

# EVM version
evm_version = "cancun"

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@chainlink/=lib/chainlink-brownie-contracts/contracts/src/v0.8/"
]

# File system permissions
fs_permissions = [
    { access = "read", path = "./configs" },
    { access = "read-write", path = "./broadcast" },
    # W3.8 (N3, task #44): read-only access to compiled ABI artifacts, so
    # test/conformance/BucketInfoSurface.t.sol can reflect on BucketInfo's
    # actual external/public function set via `vm.readFile` + `vm.parseJson`
    # instead of a hand-maintained list that silently drifts from source.
    # Read-only, and scoped to `./out` only -- no write/broadcast capability
    # granted, and no `ffi` needed (`ffi` is not enabled anywhere in this
    # file and this change does not turn it on).
    { access = "read", path = "./out" }
]

# Gas reporting
# W0.6: this key was previously placed AFTER [profile.default.invariant] below,
# so TOML parsed it as an invariant-profile key and gas reporting was silently
# off. It belongs to [profile.default] and must stay above every [profile.*.x]
# sub-table on this page.
gas_reports = ["*"]

# Testing configuration
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 15
# W0.5: flipped from false to true while there is still no invariant suite to
# make vacuous (verified 2026-09-24: zero StdInvariant inheritance in src/ or
# test/). This is free today; once handlers exist, flipping it turns a
# passing run red. See root CLAUDE.md §5.4 and INV-12's precondition note.
fail_on_revert = true

# Etherscan verification
# W0.2: Polygon + Polygon Amoy added — previously absent entirely, which would
# have blocked any Polygon deploy/verify step. Reuses ETHERSCAN_API_KEY, same
# convention as mainnet/sepolia below (Etherscan's unified v2 API key
# works across chains including Polygon).
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
polygon = { key = "${ETHERSCAN_API_KEY}" }
polygon_amoy = { key = "${ETHERSCAN_API_KEY}" }

# RPC endpoints
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"
localhost = "http://localhost:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
